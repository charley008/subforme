mixed-port: 7890
allow-lan: true
bind-address: "*"
unified-delay: true
mode: rule
log-level: info
ipv6: true

sniffer:
  enable: true
  sniff:
    TLS:
      ports:
        - 443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true

dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  prefer-h3: false
  respect-rules: false
  use-hosts: false
  use-system-hosts: false
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "*.ts.net"
    - "time.*.com"
    - "ntp.*.com"
    - "pool.ntp.org"
    - "time.windows.com"
    - "time.apple.com"
    - "time.asia.apple.com"
    - "time-ios.apple.com"
    - "captive.apple.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "www.msftconnecttest.com"
    - "*.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "+.market.xiaomi.com"
    - "+.cmpassport.com"
    - "id6.me"
    - "+.10099.com.cn"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://doh.dns.sb/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.adguard-dns.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - "0.0.0.0/32"
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
  nameserver-policy:
    "geosite:apple": https://dns.alidns.com/dns-query
    "+.tjstats.com": https://dns.alidns.com/dns-query
    "+.gstatic.com": https://dns.alidns.com/dns-query
    "fastly.jsdelivr.net": https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

tun:
  enable: false
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

proxy-providers: {}
